[project]
name = "mcp-service"
version = "0.1.0"
description = "MCP service using FastMCP"
authors = [
    {name = "Zane Reynolds", email = "zane.reynolds@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastmcp>=2.0.0",
    "starlette>=0.50.0",
    "aiosqlite>=0.20.0",
    "lancedb>=0.26.0",
    "httpx>=0.27.0",
    "pyarrow>=18.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "mcp>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
