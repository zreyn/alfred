services:
  ollama:
    image: ollama/ollama:latest
    container_name: local-ollama
    environment:
      - OLLAMA_KEEP_ALIVE=1
      - OLLAMA_HOST=0.0.0.0:11434
    ports:
      - "0.0.0.0:11434:11434" # 11434:11434 alone leaves it open just to the docker network
    networks:
      - alfred-network
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  ollama-init:
    image: curlimages/curl:latest
    container_name: local-ollama_init
    networks:
      - alfred-network
    depends_on:
      ollama:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        echo "Waiting for Ollama to be ready..."
        sleep 5
        echo "Pulling qwen3:8b model..."
        curl -X POST http://local-ollama:11434/api/pull -d '{"name": "qwen3:8b"}'
        echo "Model pulled. Keeping it loaded..."
        curl -X POST http://local-ollama:11434/api/generate -d '{"model": "qwen3:8b", "prompt": "test", "keep_alive": -1}'
        echo "Init complete"

  f5-tts-service:
    build:
      context: .
      dockerfile: f5-tts-service/Dockerfile
    container_name: f5-tts-service
    restart: unless-stopped
    environment:
      - CHARACTER=${CHARACTER:-sir_henry}
    networks:
      - alfred-network
    ports:
      - "11800:11800"
    volumes:
      # Mount reference audio files
      - ./f5-tts-service/ref:/app/ref:ro 
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11800/health"]
      interval: 10s
      start_period: 60s

  health-service:
    build:
      context: .
      dockerfile: health-service/Dockerfile
    container_name: health-service
    restart: unless-stopped
    networks:
      - alfred-network
    ports:
      - "8080:8080"
    volumes:
      # Mount host /proc and /sys for accurate host metrics
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      # Docker socket for container health monitoring
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Tell psutil to use host proc/sys
      - PROC_PATH=/host/proc
      - SYS_PATH=/host/sys
      - HOST_ROOT=/host/root
      # LiveKit API credentials for stats endpoint
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - LIVEKIT_URL=http://${LIVEKIT_NODE_IP}:7880
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  livekit-server:
    image: livekit/livekit-server:latest
    container_name: livekit-server
    network_mode: host  # Required for WebRTC - avoids NAT issues
    command: --config /etc/livekit.yaml --node-ip ${LIVEKIT_NODE_IP}
    volumes:
      - ./livekit/config.yml:/etc/livekit.yaml:ro
    restart: unless-stopped

  voice-agent:
    image: voice-agent:latest
    build:
      context: .
      dockerfile: agent/Dockerfile
    container_name: voice-agent
    network_mode: host  # Use host network to reach livekit (WebRTC) and host-exposed services
    depends_on:
      ollama:
        condition: service_healthy
      f5-tts-service:
        condition: service_healthy
      livekit-server:
        condition: service_started
      mcp-service:
        condition: service_healthy
    environment:
      - STT_DEVICE=${STT_DEVICE:-cuda}
      - OLLAMA_HOST=localhost:11434  # Access via host network since ollama exposes port to host
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:8b}
      - MCP_SERVICE_URL=http://localhost:8000/mcp  # Access via host network
      - LIVEKIT_URL=ws://localhost:7880  # Access livekit on host network
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
    volumes:
      # Mount models directory if you have models locally
      - ./agent/models:/app/models:ro
      # Optional: mount reference audio if you want to modify without rebuild
      - ./agent/ref:/app/ref:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "python"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s  # Allow time for model loading

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    networks:
      - alfred-network
    ports:
      - "3000:3000"
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=${LIVEKIT_NODE_IP}:3000,localhost:3000
      - HOMEPAGE_HOST=${HOMEPAGE_HOST:-localhost}
      - PUID=${LOCAL_USER_ID:-1000}
      - PGID=${LOCAL_GROUP_ID:-1000}
    volumes:
      - ./homepage/config:/app/config
      - ./homepage/background-1.jpg:/app/public/images/background-1.jpg:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    networks:
      - alfred-network
    environment:
      N8N_PORT: 5678
      N8N_HOST: 0.0.0.0
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    restart: always

  mcp-service:
    build:
      context: .
      dockerfile: mcp-service/Dockerfile
    container_name: mcp-service
    restart: unless-stopped
    networks:
      - alfred-network
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  alfred-network:
    driver: bridge

volumes:
  ollama_data:
    driver: local
  n8n_data:
    driver: local
