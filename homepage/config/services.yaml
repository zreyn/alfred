---
# Homepage services configuration
# Documentation: https://gethomepage.dev/configs/services/

- Services:
    - Ollama:
        href: http://local-ollama:11434
        description: Local LLM server
        icon: ollama.png
    - n8n:
        href: http://n8n:5678
        description: Workflow automation
        icon: n8n.png
    - LiveKit:
        href: http://localhost:7880
        description: WebRTC server (host network)
    - F5-TTS:
        href: http://f5-tts-service:11800
        description: Text-to-speech service

- System:
    - Health:
        href: http://health-service:8080
        description: GPU health monitoring
        widget:
          type: customapi
          url: http://health-service:8080/status
          refreshInterval: 5000
          mappings:
            - field: gpu.gpus.0.utilization_percent
              label: GPU
              format: percent
            - field: gpu.gpus.0.memory_utilization_percent
              label: VRAM
              format: percent
            - field: gpu.gpus.0.temperature_c
              label: GPU Temp
              format: number